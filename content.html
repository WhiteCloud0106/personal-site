<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>內容｜創作基地</title><link rel="stylesheet" href="styles.css"><style>.reader{max-width:850px;margin:auto;padding:90px 24px 140px}.reader>a{font-weight:800}.reader header{border-bottom:1px solid var(--line);padding:3rem 0 2rem;margin-bottom:2rem}.reader h1{font-size:clamp(2.7rem,7vw,5rem);line-height:1.1;margin:.4rem 0}.reader .summary{font-size:1.15rem;color:var(--muted)}.prose{font-size:1.05rem}.chapter{padding:2rem 0;border-top:1px solid var(--line)}.chapter h2{font-size:2rem}.chapter time,.tag{font-size:.75rem;color:var(--coral);font-weight:800;letter-spacing:.08em}.web-frame{width:100%;height:70vh;border:1px solid var(--ink);background:white;margin-top:2rem}</style></head><body><main class="reader"><a href="index.html">← 回到創作基地</a><article id="content"><p>正在載入內容…</p></article></main><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const md=v=>DOMPurify.sanitize(marked.parse(v||''));
(async()=>{const p=new URLSearchParams(location.search),type=p.get('type'),id=p.get('id'),data=await fetch('content/site.json').then(r=>r.json());let item,title,html='';if(type==='novel'){item=(data.novels||[]).find(x=>x.id===id);if(item){title=item.title;html=`<header><span class="tag">${esc(item.status)}</span><h1>${esc(item.title)}</h1><div class="summary">${md(item.description)}</div></header>${(item.chapters||[]).map((c,i)=>`<section class="chapter"><time>${esc(c.date)}</time><h2>${esc(c.title||`第 ${i+1} 章`)}</h2><div class="prose">${md(c.body)}</div></section>`).join('')}`}}else if(type==='project'){item=(data.projects||[]).find(x=>x.id===id);if(item){title=item.title;html=`<header><span class="tag">${esc(item.status)}</span><h1>${esc(item.title)}</h1><p class="summary">${esc(item.summary)}</p></header><div class="prose">${md(item.details)}</div>${item.url?`<p><a class="button primary" href="${esc(item.url)}">前往專案 ↗</a></p>`:''}`}}else if(type==='devlog'){item=(data.devlogs||[]).find(x=>x.id===id);if(item){title=item.title;html=`<header><span class="tag">${esc(item.category)} · ${esc(item.date)}</span><h1>${esc(item.title)}</h1><p class="summary">${esc(item.summary)}</p></header><div class="prose">${md(item.body)}</div>`}}else if(type==='webapp'){item=(data.webapps||[]).find(x=>x.id===id);if(item){title=item.title;html=`<header><span class="tag">${esc(item.status)}</span><h1>${esc(item.title)}</h1><p class="summary">${esc(item.summary)}</p></header><iframe class="web-frame" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock" title="${esc(item.title)}"></iframe>`}}document.title=`${title||'找不到內容'}｜創作基地`;document.querySelector('#content').innerHTML=html||'<h1>找不到這項內容</h1>';if(type==='webapp'&&item)document.querySelector('iframe').srcdoc=item.html||''})().catch(()=>document.querySelector('#content').innerHTML='<h1>內容載入失敗</h1>');
</script></body></html>
